# Author: Tommy
name: Judge verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    name: Offline checks / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm run verify
      - name: Checkout stays unchanged
        run: test -z "$(git status --porcelain)"
  browser:
    name: Chrome / recorded demo and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run test:browser
      - name: Checkout stays unchanged
        run: test -z "$(git status --porcelain)"
  contract:
    name: Rust / WASM / five sandbox cases
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.86.0 --profile minimal --target wasm32-unknown-unknown
      - name: Contract tests and lint
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build production WASM
        run: npm run build:contract
      - name: Prepare isolated runtime dependencies and sandbox
        run: cargo +1.99.1 test --manifest-path runtime-tests/Cargo.toml --locked --no-run --target-dir target/runtime
      - name: Execute isolated WASM runtime cases
        run: npm run test:runtime
      - name: Checkout stays unchanged
        run: test -z "$(git status --porcelain)"
